# DCF assumptions for Apple (AAPL)
#
# Every section has a "source" line: write down where each number comes from,
# so the model can always be explained. Rates are decimals: 0.05 means 5%.
# After each earnings call, update the numbers and say why in your Git commit message.

horizon_years = 5
horizon_source = "Mature business: growth should settle within five years"

[growth]
# Revenue growth for the first forecast years. Year 1 is FY2027, the fiscal year in progress.
# After these, growth fades in a straight line to the terminal rate by the final year.
near_term = [0.07, 0.05]
terminal = 0.052
terminal_roic = 0.75
source = """
Near-term growth: Consustent with growth guidance.
Terminal growth: Consistent with Damodaran’s implied ERP, which assumes long-run growth equal to the 10-year Treasury yield. 
Return on new capital: accounting ROIC on new capital was about 105% over FY2021-26, but invested capital is near zero, so it is noisy. 
R&D-adjusted ROIC of 116% in FY2026 confirms returns far above WACC. Set below history because R&D spending is rising faster than revenue.
"""

[operations]
ebit_margin_target = 0.33      # held near the FY2026 level of 33.0%
tax_rate = 0.16
d_and_a_pct_revenue = 0.028    # FY2026: 2.8%
capex_pct_revenue = 0.03       # kept at or above D&A, since long-term growth needs reinvestment
nwc_pct_revenue_change = 0.0   # Apple runs with very little working capital
source = "STARTING POINT based on recent history. Review against the 'Last 3 years' line"

[discount_rate]
equity_risk_premium = 0.044
credit_rating = "AA+"
# These are fetched automatically unless you set them:
# risk_free_rate = 0.051       # 10-year Treasury yield (from Bloomberg)
# beta = 1.06                   # from yfinance
# pretax_cost_of_debt = 0.055  # otherwise risk-free rate + the spread for the rating
source = """
Beta: Blume-adjusted, 0.67 x raw 1.09 (yfinance, 5Y monthly) + 0.33 x 1.0 = 1.06. 
ERP: Damodaran implied ERP, November 2026."
"""